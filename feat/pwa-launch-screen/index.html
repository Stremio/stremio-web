<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=0,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Stremio"><meta name="theme-color" content="#2a2843"><link rel="icon" type="image/x-icon" href="favicons/favicon.ico"><link rel="apple-touch-icon" href="images/icon_196x196.png"><link rel="manifest" href="manifest.json"/><title>Stremio - Freedom to Stream</title><style>#launch-screen {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 32px;
            background: linear-gradient(41deg, rgba(12, 11, 17, 1) 0%, rgba(26, 23, 62, 1) 100%);

        }

            opacity: 0;

            height: 128px;

            border-radius: inherit;
            background-color: rgb(123, 91, 245);
            animation: 1.2s ease-in-out infinite launch-screen-progress;
        }

            0% {
                opacity: 0.55;
            }

            100% {
                opacity: 1;
            }
        }

        @keyframes launch-screen-progress {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(250%);
            }
        }

            }

            }

            }

                animation: none;
